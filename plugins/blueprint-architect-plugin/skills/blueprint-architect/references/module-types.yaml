    { "id": "adapter", "purpose": "Translate between a domain boundary and an external service or protocol.", "required_sections": ["responsibilities", "interfaces", "dependencies", "configuration", "failure-modes", "security", "tests"] },
    { "id": "persistence", "purpose": "Own schema, migration, transaction, and persistence mapping responsibilities.", "required_sections": ["responsibilities", "owned-data", "interfaces", "transactions", "failure-modes", "security", "tests"] },
    { "id": "background-worker", "purpose": "Own asynchronous jobs, retries, idempotency, and dead-letter behavior.", "required_sections": ["responsibilities", "interfaces", "data-flow", "idempotency", "failure-modes", "observability", "tests"] },
    { "id": "interface", "purpose": "Own a versioned public or internal contract and its compatibility policy.", "required_sections": ["owner", "consumers", "transport", "request", "response", "errors", "authentication", "idempotency", "versioning"] },
