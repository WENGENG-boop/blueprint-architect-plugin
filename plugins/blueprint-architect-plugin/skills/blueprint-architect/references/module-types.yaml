{
  "version": 1,
  "module_types": [
    {
      "id": "application",
      "purpose": "User-facing routes, layouts, and request entry points.",
      "default_directories": ["app"],
      "required_sections": ["responsibilities", "interfaces", "data-flow", "edge-cases", "checklist"]
    },
    {
      "id": "components",
      "purpose": "Reusable presentation and interaction components.",
      "default_directories": ["components"],
      "required_sections": ["responsibilities", "interfaces", "accessibility", "dependencies", "checklist"]
    },
    {
      "id": "domain",
      "purpose": "Business rules and use-case orchestration independent of delivery frameworks.",
      "default_directories": ["lib"],
      "required_sections": ["responsibilities", "interfaces", "invariants", "errors", "checklist"]
    },
    {
      "id": "infrastructure",
      "purpose": "External services, persistence, authentication, messaging, and deployment adapters.",
      "default_directories": ["lib/integrations"],
      "required_sections": ["responsibilities", "configuration", "failure-modes", "security", "checklist"]
    },
    {
      "id": "tests",
      "purpose": "Deterministic unit and integration verification.",
      "default_directories": ["tests/unit", "tests/integration"],
      "required_sections": ["scope", "fixtures", "boundaries", "commands", "checklist"]
    }
  ]
}
