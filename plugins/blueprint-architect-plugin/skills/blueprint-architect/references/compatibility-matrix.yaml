{
  "version": 1,
  "rules": [
    {
      "id": "serverless-relational-connections",
      "when": { "backend": "serverless", "database": { "any_of": ["postgresql", "mysql"] } },
      "severity": "warning",
      "issue": "Direct database connections from rapidly scaling functions can exhaust connection limits.",
      "corrections": [
        { "id": "pooled-managed-database", "description": "Use a managed database endpoint with serverless-safe pooling." },
        { "id": "connection-proxy", "description": "Add a compatible connection proxy and define its operational ownership." }
      ]
    },
    {
      "id": "spa-critical-seo",
      "when": { "frontend": { "any_of": ["react-spa", "vue-spa"] }, "requirement": "seo-critical" },
      "severity": "warning",
      "issue": "Client-only rendering can weaken reliable indexing and initial content delivery.",
      "corrections": [
        { "id": "hybrid-rendering", "description": "Use a framework supporting server or static rendering for public content." },
        { "id": "separate-marketing-site", "description": "Keep the application SPA and render public acquisition pages separately." }
      ]
    },
    {
      "id": "static-realtime",
      "when": { "frontend": { "any_of": ["static-site", "astro-static"] }, "requirement": "realtime" },
      "severity": "info",
      "issue": "Static delivery needs an explicit client-side realtime channel.",
      "corrections": [
        { "id": "managed-realtime", "description": "Add a managed realtime service and document authorization boundaries." },
        { "id": "hybrid-application", "description": "Use a hybrid application runtime for authenticated realtime areas." }
      ]
    },
    {
      "id": "local-state-multi-instance",
      "when": { "session_store": "process-memory", "deployment": "multi-instance" },
      "severity": "error",
      "issue": "Process-local session state is not shared across instances and can invalidate requests unpredictably.",
      "corrections": [
        { "id": "shared-session-store", "description": "Store sessions in a shared database or cache." },
        { "id": "stateless-sessions", "description": "Use protected stateless sessions when revocation requirements allow it." }
      ]
    }
  ]
}
