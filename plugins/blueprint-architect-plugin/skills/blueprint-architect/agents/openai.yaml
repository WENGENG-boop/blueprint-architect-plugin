interface:
  display_name: "Blueprint Architect"
  short_description: "Interpret PRDs and plan compatible project blueprints"
  default_prompt: "Use $blueprint-architect to analyze this PRD, explain its fundamental product problem, and guide material decisions. Prefer request_user_input for every decision, compatibility correction, and final confirmation when available: one question at a time, 2-3 mutually exclusive options, recommendation first ending in '(Recommended)', and one concise trade-off per option. In Plan mode use the structured selector. Outside Plan mode, or if the selector is unavailable, continue with the same options as a numbered prose list and ask me to reply with the number or exact label."

policy:
  allow_implicit_invocation: true
